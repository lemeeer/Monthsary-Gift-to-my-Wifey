<script>
const W=960,H=700,SX=10,ENV_X=715,ENV_Y=290,ENV_W=200,ENV_H=140,CELL=10,N=70;
const MESSAGE=["Happy 1st","monthsary love"];
const BODY="Happy monthsary, baby!\nThis date 17, I remember how happy I was when you finally said yes. I kept rereading your message just to make sure I had read it right HAHAHA. I couldn't believe it was actually happening, and here we are now, celebrating another month together.\nLooking back at everything we've shared these past months, I'm really happy I get to experience all of this with you. I love our random conversations, listening to your stories and little rants, and watching movies together. I love it when you send me pictures of yourself, when you tell me about whatever is going on in your head, and even when you open your camera just so I can watch you eat HAHAHAHAHAHA. I don't know if you realize it, but those things mean a lot to me. I like that you let me be part of those little moments in your day. Even when you have something deep to talk about, I love listening to what you have to say and getting to know how you see things.\nThank you for being patient with me and my corny jokes HAHAHAHAHHAHAA. I know I still have things to learn when it comes to expressing my feelings, but I hope you know how much I love you my love. I want to keep finding ways to make you feel loved, appreciated, and valued because you mean so much to me.\nI know there will be times when we won't understand each other right away or when things get difficult, but I want us to keep learning how to understand each other better. I want to be there when you're happy, when you're stressed, and even when you don't feel like talking. I want to be someone you can count on, someone who makes you feel that you don't have to figure everything out alone. I'll keep choosing you and putting effort into what we have.\nI really do want to marry you someday. I want us to achieve the dreams we've talked about, become successful in our own ways, and be there to celebrate each other's achievements. I want us to look back someday and see how far we've come, knowing that we both worked hard to get where we are. I want to see you achieve everything you've been working for, and I hope you'll be there to see me achieve mine, too.\nI don't know exactly what the future has in store for us, but I know I want to share it with you. Thank you for saying yes to me, baby. I'm really happy I get to love you.",CLOSING="I love you so much, wifeyy. \u2764\uFE0F";
const BURG="#7a1f33",BURG_D="#5e1526",BURG_L="#a63a52",CHARS="0@#%&o8";
const MONO='Consolas,"Courier New",monospace',FONT='bold 12px '+MONO;
const PINK="#e0668a",PINK_D="#b8456c",LAV="#9aa5ff",WHITE="#e6e9ff",RIM="#8a3350";
const COLORS=["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#c77dff","#ff9e00","#ffffff","#f72585"];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- pixel helpers ----------
const ok=(x,y)=>x>=0&&x<N&&y>=0&&y<N, set=(g,x,y,c)=>{if(ok(x,y))g.set(y*N+x,c)};
function sell(g,cx,cy,rx,ry,col,p=2){for(let y=Math.trunc(cy-ry)-1;y<Math.trunc(cy+ry)+2;y++)for(let x=Math.trunc(cx-rx)-1;x<Math.trunc(cx+rx)+2;x++)
  if(ok(x,y)&&(Math.abs(x-cx)/rx)**p+(Math.abs(y-cy)/ry)**p<=1)g.set(y*N+x,col)}
function dome(g,cx,cy,rx,ry,col){for(let y=Math.trunc(cy-ry)-1;y<Math.trunc(cy)+1;y++)for(let x=Math.trunc(cx-rx)-1;x<Math.trunc(cx+rx)+2;x++)
  if(ok(x,y)&&((x-cx)/rx)**2+((y-cy)/ry)**2<=1)g.set(y*N+x,col)}
function rect(g,x0,y0,x1,y1,col){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(g,x,y,col)}
function shade(col,d){const f=i=>Math.max(0,Math.min(255,parseInt(col.substr(i,2),16)+d));return'#'+[1,3,5].map(i=>f(i).toString(16).padStart(2,'0')).join('')}
function drawGrid(x,g,ox=SX,oy=0){x.font=FONT;x.textAlign='center';x.textBaseline='middle';
  for(const[k,col]of g){const px=k%N,py=(k/N)|0;
    x.fillStyle=shade(col,(px*31+py*17)%29-14);
    x.fillText(CHARS[(px*7+py*13)%CHARS.length],ox+px*CELL+CELL/2,oy+py*CELL+CELL/2)}}
function sprite(g,ox=SX,oy=0){const k=mk();drawGrid(k.getContext('2d'),g,ox,oy);return k}
const stripe=y=>y%2===0?LAV:WHITE;

// ---------- gift box ----------
function boxGrid(){const g=new Map();sell(g,35,50,22,17,PINK,6);
  for(const k of [...g.keys()]){const x=k%N,y=(k/N)|0;g.set(k,(x>=32&&x<=38)?stripe(y):(y%2===0?PINK:PINK_D))}
  for(let y=33;y<41;y++)for(let x=11;x<60;x++)g.set(y*N+x,stripe(y));return g}
function boxFrontSprite(){const g=boxGrid(),low=new Map();
  for(const[k,col]of g){const y=(k/N)|0;if(y>=56)low.set(k,(y===56||y===57)?RIM:col)}return sprite(low)}

// ---------- bow ----------
function bowLoop(g,cx,cy,rx,ry,side,s,co){const d0=side*s,d1=-co,p0=co,p1=side*s;
  for(let y=Math.trunc(cy-ry)-1;y<Math.trunc(cy+ry)+2;y++)for(let x=Math.trunc(cx-ry)-1;x<Math.trunc(cx+ry)+2;x++)if(ok(x,y)){
    const dx=x-cx,dy=y-cy,u=dx*p0+dy*p1,v=dx*d0+dy*d1;
    if((u/rx)**2+(v/ry)**2<=1){let col=stripe(y);if(rx>3&&(u/(rx*.4))**2+(v/(ry*.7))**2<=1)col="#d0557c";g.set(y*N+x,col)}}}
function drawBow(prog,ext,tt){const g=new Map();
  const th=(25+63*prog)*Math.PI/180+.07*Math.sin(tt*3)*(1-prog),ry=12+6*prog,rx=Math.max(2.4,6.5-3.8*prog),s=Math.sin(th),co=Math.cos(th);
  for(const side of[-1,1])bowLoop(g,35+side*s*ry*.9+side*ext*40,33-co*ry*.9-ext*6,rx,ry,side,s,co);
  if(prog<.6)for(const side of[-1,1])for(let k=0;k<10;k++){const x=Math.trunc(35+side*(2+k*.5)),y=34+k;set(g,x,y,stripe(y));set(g,x+side,y,stripe(y))}
  if(prog<.25){sell(g,35,33,3.5,3,"#5a68d8");set(g,34,32,"#ffffff")}
  drawGrid(ctx,g)}

// ---------- capybara ----------
function capySprite(){const g=new Map(),brown="#c4905a",dark="#7a4e2a",light="#e6c294";
  sell(g,35,52,23,17,dark);sell(g,35,52,22,16,"#b5814f");
  sell(g,22,15,3.5,3.5,dark);sell(g,48,15,3.5,3.5,dark);
  sell(g,35,27,17,14,dark,3);sell(g,35,27,16,13,brown,3);
  sell(g,35,34,12,7,light,3);rect(g,30,29,40,30,"#2b1708");rect(g,35,31,35,37,"#2b1708");for(let x=29;x<=41;x++){const d=(x-35)/6;set(g,x,Math.round(34+3*(1-d*d)),"#2b1708")}set(g,34,38,"#e58a8a");set(g,36,38,"#e58a8a");
  sell(g,24,33,2.5,1.5,"#e58a8a");sell(g,46,33,2.5,1.5,"#e58a8a");
  rect(g,26,22,27,23,"#120a04");rect(g,43,22,44,23,"#120a04");set(g,26,22,"#ffffff");set(g,43,22,"#ffffff");
  for(let i=0,x=18;x<53;x+=4,i++)for(let k=0;k<13;k++){const xx=x+Math.round(Math.sin(i+k*.7)*1.5);set(g,xx,55+k,"#2f4aa8");set(g,xx+1,55+k,"#2f4aa8")}
  dome(g,35,55,21,14,"#0b1a4d");dome(g,35,55,19,12,"#14297a");dome(g,35,55,17,10,"#1b3499");
  sell(g,14,54,4.5,3.5,dark);sell(g,56,54,4.5,3.5,dark);sell(g,14,54,3.5,2.5,brown);sell(g,56,54,3.5,2.5,brown);
  const k=sprite(g),x=k.getContext('2d');x.fillStyle="#ffe9f1";x.shadowColor="#ff9ec4";x.shadowBlur=14;x.font='bold 23px '+MONO;x.textAlign='center';x.textBaseline='middle';
  x.fillText(MESSAGE[0],350+SX,500);x.fillText(MESSAGE[1],350+SX,528);return k}

// ---------- envelope ----------
function envSprite(){const g=new Map(),EW=20,EH=14;
  for(let y=0;y<EH;y++)for(let x=0;x<EW;x++)g.set(y*N+x,BURG);
  for(let y=0;y<8;y++)for(let x=y;x<EW-y;x++)g.set(y*N+x,BURG_D);
  for(let y=0;y<8;y++){g.set(y*N+y,BURG_L);g.set(y*N+EW-1-y,BURG_L)}
  for(let x=0;x<10;x++){const y=EH-1-Math.trunc(x*.7);g.set(y*N+x,BURG_L);g.set(y*N+EW-1-x,BURG_L)}
  ["0110110","1111111","1111111","0111110","0011100","0001000"].forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(ch==="1")g.set((5+yy)*N+7+xx,"#f2c15a")}));
  g.set(6*N+8,"#fff1c4");
  const k=sprite(g,ENV_X,ENV_Y),x=k.getContext('2d');x.fillStyle="#b9a8d6";x.font='16px '+MONO;x.textAlign='center';x.textBaseline='middle';
  x.fillText("a letter for you",ENV_X+ENV_W/2,ENV_Y+ENV_H+34);x.fillText("tap to read",ENV_X+ENV_W/2,ENV_Y+ENV_H+56);return k}

// ---------- background ----------
const lerp=(a,b,t)=>'#'+[0,1,2].map(k=>Math.trunc(a[k]+(b[k]-a[k])*t).toString(16).padStart(2,'0')).join('');
function bgSprite(){const k=mk(),x=k.getContext('2d');
  for(let i=0;i<35;i++){x.fillStyle=lerp([5,5,18],[28,14,46],i/34);x.fillRect(0,i*H/35,W,H/35+1)}
  const oval=(cx,cy,rx,ry,f)=>{x.fillStyle=f;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()};
  for(let i=0;i<22;i++){const r=440-i*19;oval(480,520,r,r*.8,lerp([14,8,30],[66,30,90],(i/21)**1.3))}
  oval(360,675,250,17,"#0c0714");
  const rb=seeded(7);for(let i=0;i<26;i++){const bx=rb()*W,by=rb()*H,br=14+rb()*38,g=x.createRadialGradient(bx,by,0,bx,by,br),col=['255,158,196','186,150,255','255,214,150'][i%3];
    g.addColorStop(0,`rgba(${col},.16)`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.beginPath();x.arc(bx,by,br,0,7);x.fill()}
  const vg=x.createRadialGradient(480,350,260,480,350,720);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=vg;x.fillRect(0,0,W,H);return k}
const stars=Array.from({length:80},()=>[RI(0,W),RI(0,H),R(0,6.28),R(1,3)]);
const hearts=Array.from({length:12},()=>[RI(20,W-20),RI(0,H),R(.3,.9),R(0,6.28),pick(["#6b2a55","#4d2f7a","#7a3350"]),pick([16,21,27])]);

function drawPhoto(y,cx,top){   // real jasmine photo as a taped polaroid
  const pw=390,ph=430,x0=cx-pw/2;
  y.save();y.translate(cx,top+ph/2);y.rotate(-.025);y.translate(-cx,-(top+ph/2));
  y.shadowColor="rgba(60,30,20,.35)";y.shadowBlur=18;y.shadowOffsetY=6;
  y.fillStyle="#fffdf8";y.fillRect(x0,top,pw,ph);
  y.shadowColor="transparent";y.shadowBlur=0;y.shadowOffsetY=0;

  y.strokeStyle="rgba(0,0,0,.08)";y.lineWidth=1;y.strokeRect(x0+20,top+20,350,350);
  y.textAlign='center';y.textBaseline='middle';y.fillStyle=BURG;y.font='600 31px "Dancing Script","Segoe Script","Brush Script MT",cursive';
  y.fillText("Flowers for you my love",cx,top+400,330);
  y.strokeStyle="rgba(166,58,82,.45)";y.lineWidth=1.2;y.beginPath();y.moveTo(cx-60,top+418);y.quadraticCurveTo(cx,top+411,cx+60,top+418);y.stroke();
  y.fillStyle="rgba(235,205,160,.7)";y.save();y.translate(cx,top);y.rotate(.04);y.fillRect(-48,-13,96,26);y.restore();
  y.restore()}
function wrap(x,text,px,py,maxW,lh){let y=py;for(const para of text.split("\n")){let ln="";
  for(const w of para.split(" ")){const t=ln?ln+" "+w:w;if(x.measureText(t).width>maxW&&ln){x.fillText(ln,px,y);y+=lh;ln=w}else ln=t}
  x.fillText(ln,px,y);y+=lh+12}return y}

let state="gift",tEnv=0,tOpen=0,tUntie=0,letterOpen=false,tLetter=0,envPrev=0,shakeX=0,confetti=[];

function frame(){
  const tt=now()-start;
  ctx.drawImage(bg,0,0);fwFrame(tt);
  for(const s of stars){const b=(Math.sin(tt*s[3]+s[2])+1)/2,v=Math.trunc(90+165*b),r=1+b;
    ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.beginPath();ctx.arc(s[0],s[1],r,0,7);ctx.fill()}

    ctx.fillStyle=h[4];ctx.font=h[5]+'px "Segoe UI Symbol",Arial,sans-serif';ctx.fillText("\u2665",h[0]+Math.sin(tt*1.5+h[3])*14,h[1])}
  const dy=Math.sin(tt*2)*3;envPrev=dy;

    if(b>.35){ctx.fillStyle="#f2c15a";ctx.font=Math.trunc(14+10*b)+'px "Segoe UI Symbol",Arial,sans-serif';ctx.fillText("\u2726",ENV_X+ox,ENV_Y+oy+dy)}});

  if(state==="reveal")ctx.drawImage(capyImg,0,0);          // capybara sits behind the box front
  if(state==="explode"||state==="reveal"){const q=Math.min((now()-tOpen)/.7,1);ctx.drawImage(frontImg,0,90*(1-(1-q)**3))}   // box front sinks down so the jellyfish shows

  if(state==="gift"){ctx.drawImage(boxImg,0,0);drawBow(0,0,tt);
    ctx.fillStyle="#b9a8d6";ctx.font='17px '+MONO;ctx.fillText("tap or press SPACE to open",350+SX,688)}
  else if(state==="untie"){const e=now()-tUntie;let sx=0;

    else{const k=Math.min((e-1.6)/.6+.2,1);sx=Math.sin(e*60)*5*k}
    ctx.drawImage(boxImg,sx,0);if(e<1.6)drawBow(Math.min(e/1,1),Math.max(0,(e-1)/.6),tt);

  if(state==="reveal"){const a=Math.min((now()-tEnv)/1.2,1);ctx.globalAlpha=a;ctx.drawImage(env,0,dy+(1-a)*50);ctx.globalAlpha=1}

  if(letterOpen){const p=Math.min((now()-tLetter)/.5,1);
    if(p>=1){if(!letterImg)letterImg=buildLetter();drawLetter()}
    else{const e=1-(1-p)**3,x0=ENV_X+(150-ENV_X)*e,y0=ENV_Y+(30-ENV_Y)*e,x1=ENV_X+ENV_W+(810-ENV_X-ENV_W)*e,y1=ENV_Y+ENV_H+(670-ENV_Y-ENV_H)*e;
      ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#07040a";ctx.fillRect(x0+8,y0+8,x1-x0,y1-y0);
      ctx.fillStyle="#f6ecd9";ctx.fillRect(x0,y0,x1-x0,y1-y0);ctx.strokeStyle=BURG;ctx.lineWidth=4;ctx.strokeRect(x0,y0,x1-x0,y1-y0)}}
}
const rockets=[],sparks=[];let nextFw=1;
function fwFrame(t){
  if(t>nextFw){nextFw=t+(state==="reveal"?R(.5,1.2):R(1.4,2.6));rockets.push({x:R(90,870),y:H,px:0,py:0,vx:R(-.5,.5),vy:-R(13,17),ty:R(80,300),c:pick(COLORS)})}
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.px=r.x;r.py=r.y;r.x+=r.vx;r.y+=r.vy;r.vy*=.985;
    ctx.globalAlpha=.8;ctx.strokeStyle='#ffe6b4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r.px,r.py);ctx.lineTo(r.x,r.y);ctx.stroke();
    if(r.y<=r.ty||r.vy>-2.5){rockets.splice(i,1);const n=RI(45,70),ring=Math.random()<.4,c2=pick(COLORS);
      for(let k=0;k<n;k++){const a=k/n*6.283+R(0,.1),s=ring?4.2:R(1.2,5);sparks.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:k%3===0?c2:r.c})}}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.px=s.x;s.py=s.y;s.vx*=.965;s.vy=s.vy*.965+.07;s.x+=s.vx;s.y+=s.vy;s.l-=.016;
    if(s.l<=0){sparks.splice(i,1);continue}
    ctx.globalAlpha=s.l*.9;ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.px,s.py);ctx.lineTo(s.x,s.y);ctx.stroke()}
  ctx.restore()}
let last=0;
(function loop(t){requestAnimationFrame(loop);if(t-last>=30){last=t;frame()}})(0);

// ---------- music (mp3 file, starts on first tap) ----------
const audio=new Audio('music.mp3');audio.loop=true;audio.volume=.7;
let musicOn=true;
function startMusic(){if(musicOn)audio.play().catch(()=>{})}
document.getElementById('mu').onclick=e=>{
  musicOn=!musicOn;e.target.textContent=musicOn?"♪ music on":"♪ music off";
  if(musicOn)audio.play().catch(()=>{});else audio.pause()};

// ---------- input ----------
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const setS=v=>{scrollT=Math.max(0,Math.min(maxS(),v))};
let drag=null;
cv.addEventListener('pointerdown',e=>{startMusic();const[x,y]=pos(e);
  if(letterOpen){drag={x,y,s:scrollT,moved:false};cv.setPointerCapture(e.pointerId);return}
  if(state==="reveal"&&x>=ENV_X&&x<=ENV_X+ENV_W&&y>=ENV_Y-10&&y<=ENV_Y+ENV_H+35){letterOpen=true;tLetter=now();scrollY=scrollT=0;return}
  openGift()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const[,y]=pos(e);if(Math.abs(y-drag.y)>6)drag.moved=true;if(drag.moved)setS(drag.s-(y-drag.y))});
cv.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.moved)return;
  if(Math.hypot(d.x-788,d.y-56)<22||d.x<150||d.x>810||d.y<30||d.y>670)letterOpen=false});
cv.addEventListener('wheel',e=>{if(!letterOpen)return;e.preventDefault();setS(scrollT+e.deltaY)},{passive:false});
addEventListener('keydown',e=>{
  if(letterOpen){const k=e.key;if(k==="Escape")letterOpen=false;
    else if(k==="ArrowDown"||k==="PageDown"||e.code==="Space"){e.preventDefault();setS(scrollT+(k==="ArrowDown"?60:400))}
    else if(k==="ArrowUp"||k==="PageUp"){e.preventDefault();setS(scrollT-(k==="ArrowUp"?60:400))}return}
  if(e.code==="Space"){e.preventDefault();startMusic();openGift()}else if(e.key==="r"||e.key==="R")replay()});
document.getElementById('rp').onclick=replay;
</script>
</body>
